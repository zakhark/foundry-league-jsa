server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300";
  }
  # Team calendars and BenchApp files: nginx's built-in types don't include them.
  location ~* \.ics$ {
    default_type "text/calendar; charset=utf-8";
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
  location ~* \.csv$ {
    default_type "text/csv; charset=utf-8";
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
}
